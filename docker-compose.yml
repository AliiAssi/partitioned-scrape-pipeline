services:
  mongo:
    image: mongo:7
    container_name: wrc_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: wrc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The pipeline itself. Behind a profile, so `docker compose up -d` still starts only the
  # storage the brief asks to containerise; run a stage with
  #   docker compose run --rm pipeline ingest --start-date 01/01/2024 --end-date 01/02/2024
  pipeline:
    build: .
    image: wrc-pipeline:local
    profiles: ["cli"]
    env_file: .env
    environment:
      # inside the compose network the services answer on their own names, not localhost
      MONGO_URI: mongodb://mongo:27017
      MINIO_ENDPOINT: minio:9000
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mongo_data:
  minio_data:
